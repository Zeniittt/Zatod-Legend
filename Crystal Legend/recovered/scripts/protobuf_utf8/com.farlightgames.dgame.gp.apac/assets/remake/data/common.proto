// 信使
message pet {
    optional uint32             _id                    = 1;  // 玩家身上宠物唯一id
    optional uint32             _type_id               = 2;  // 宠物类型id
    optional uint32             _level                 = 3;  // 宠物等级
    repeated uint32             _skill_levels          = 4;  // 技能等级
