    normal  = 0;    // 天梯
    robot   = 1;    // 机器人
    rookie  = 2;    // 新手引导
    test    = 3;    // 测试
    casual  = 4;    // 休闲模式
}


// 选技战斗对手类型
enum solo_oppo_type {
    nobody          = 0;    // 没有对手，你已经挂了
    player          = 1;    // 玩家1v1
    player_mirror   = 2;    // 玩家镜像
}

// 选技的单场战斗
message solo_battle {
    optional uint32                 _index          = 1; // 索引
    optional solo_user_summary      _self_user      = 2; // 自己key
    optional solo_oppo_type         _oppo_type      = 3; // 对手类型
    optional solo_user_summary      _oppo_user      = 4; // 对手key
    optional uint32                 _rseed          = 5; // 战斗种子表
    optional solo_battle_team       _self_team      = 6; // 自己英雄
    optional solo_battle_team       _oppo_team      = 7; // 对手英雄
}

// 选技能力
message solo_power {
    optional sint32     _pos            = 1; // 第几个能力，< 0 表示英雄额能力
    optional uint32     _id             = 2; // 英雄能力ID
    optional string     _name           = 3; // 英雄能力名字
    
    repeated solo_power_effect          _effects    = 10; // 效果
    optional empty_data                 _extra      = 11; // 额外数据
}

// 选技英雄能力效果
message solo_power_effect {
    optional uint32             _index                  = 1; // 第几个效果
    optional sint32             _cur_effect_times       = 2; // 当前生效次数
    optional sint32             _max_effect_times       = 3; // 最大生效次数,0表示没有限制
    optional common_config      _config                 = 4; // 效果配置
    repeated common_config      _conditions             = 5; // 生效条件
    repeated common_config      _records                = 6; // 已生效记录
    optional empty_data         _extra                  = 7; // 额外数据
}

// 选技规则
message solo_rules {
    optional solo_rules_common          _common     = 1; // 通用设置
    optional string                     _str_config = 2; // 使用配置字串
}

// 选技通用规则
message solo_rules_common {
    optional uint32     _start_hp   = 1; // 设置起始血量
    optional uint32     _start_gold = 2; // 设置起始金币
}


