// 杯赛阵容
message cup_arena_lineup {
    repeated uint32 _hero_ids  = 1; // 英雄ID列表
    optional uint32 _gs        = 2; // 阵容gs
    repeated bool   _hidden    = 3; // 是否隐藏
}

