    optional uint32     _exp        = 3; // 经验
}

// 选技中玩家的摘要信息
message solo_user_summary {
    optional solo_user_key      _user_key           = 1; // 玩家key
    optional user_summary       _user_summary       = 2; // 玩家摘要信息
    optional string             _plat               = 3; // 平台名称
    optional uint32             _show_server_id     = 4; // 显示的服务器id
    optional uint32             _hero_id            = 5; // 显示英雄ID
    optional uint32             _max_hp             = 6; // 最大血量
    optional uint32             _hp                 = 7; // 当前血量
    optional uint32             _level              = 8; // 等级
    optional uint32             _damage             = 9; // 可以造成的伤害
