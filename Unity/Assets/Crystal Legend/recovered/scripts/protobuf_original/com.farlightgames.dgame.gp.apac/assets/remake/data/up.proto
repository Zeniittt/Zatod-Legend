}

enum battle_result {
    victory  = 0;
    defeat   = 1;
    canceled = 2;
    timeout  = 3;
}

enum rankboard_type {
    static   = 0;
    dynamic  = 1;
    local    = 2;
    global   = 3;
}

// 可选奖励
