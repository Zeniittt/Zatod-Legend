    optional solo_rookie_start     _rookie_start   = 5; // 开始新手引导
    optional solo_rookie_finish    _rookie_finish  = 6; // 完成新手引导
    optional solo_query_records    _query_records  = 7; // 查询记录
    optional solo_record_detail    _record_detail  = 8; // 游戏请求
    optional solo_grade_rewards    _grade_rewards  = 9; // 领取段位奖励
}

// 打开面板
message solo_open_panel {

}

// 开始匹配
message solo_match_start {
    optional string             _version    = 1; // 客户端版本号
    optional solo_game_type    _game_type  = 2; // 游戏类型
}

// 取消匹配
message solo_match_cancel {

}

// 跳过引导
message solo_resolve_rookie {

}

// 开始新手引导
message solo_rookie_start {

}

// 完成新手引导
message solo_rookie_finish {
    optional string             _version    = 1; // 客户端版本号
    repeated uint32             _hero_ids   = 2; // 上阵英雄ID列表
    repeated uint32             _positions  = 3; // 上阵英雄位置列表
}

// 记录查询
message solo_query_records {

}

// 记录查询
message solo_record_detail {
    optional uint32            _record_id = 1; // 记录ID
}

// 领取段位奖励
message solo_grade_rewards {
    optional uint32            _grade     = 2; // 段位ID
}


// 选技游戏中请求(长连接)
message solo_game_req {
    optional solo_join                  _join               = 1;  // 加入游戏
    optional solo_loading               _loading            = 2;  // 加载同步
    optional solo_choose_hero           _choose_hero        = 3;  // 选择英雄
    optional solo_choose_power          _choose_power       = 4;  // 选择能力
    optional solo_use_power             _use_power          = 5;  // 使用能力
    optional solo_buy_card              _buy_card           = 6;  // 购买卡片
    optional solo_shop_refresh          _shop_refresh       = 7;  // 商店刷新
    optional solo_quit                  _quit               = 8;  // 退出游戏
    optional solo_battle_confirm        _battle_confirm     = 9;  // 战斗确认
    optional solo_heartbeat             _heartbeat          = 10; // 心跳
    optional solo_refresh_choices       _refresh_choices    = 11; // 刷新选项
    optional solo_monitor_player        _monitor_player     = 12; // 查看玩家信息
    optional solo_spectate_enter        _spectate_enter     = 13; // 进入观战模式
    optional solo_emoji                 _emoji              = 14; // 发表情包
    optional solo_view_journal          _view_journal       = 15; // 查看对战日志
    optional solo_view_dashboard        _view_dashboard     = 16; // 查看数据面板
}

// 加入游戏
message solo_join {
    optional solo_user_key          _user_key       = 1; // 玩家Key
    optional uint32                 _game_id        = 2; // 游戏ID
    optional string                 _version        = 3; // 版本号
    optional bool                   _is_reconnect   = 4; // 是否是重连
}

// 加载
message solo_loading {
    optional solo_user_key          _user_key   = 1; // 玩家Key
    optional uint32                 _progress   = 2; // 进度
    optional bool                   _is_finish  = 3; // 是否加载完成
}


// 选择英雄
message solo_choose_hero {
    optional solo_user_key          _user_key           = 1; // 玩家Key
    optional uint32                 _choose_id          = 2; // 选择ID
    optional uint32                 _option_index       = 3; // 选项索引
    optional bool                   _is_confirmed       = 4; // 是否确认
}


// 选择能力
message solo_choose_power {
    optional solo_user_key          _user_key           = 1; // 玩家Key
    optional uint32                 _power_pos          = 2; // 第几个英雄能力
    optional uint32                 _option_index       = 3; // 选项索引
    optional bool                   _is_confirmed       = 4; // 是否确认
}


// 使用英雄能力
message solo_use_power {
    optional solo_user_key          _user_key           = 1; // 玩家Key
    optional uint32                 _power_pos          = 2; // 第几个英雄能力
    optional uint32                 _power_id           = 3; // 能力ID
    repeated common_config          _params             = 21; // 参数, 如果需要指定流派则，specify_faction, int参数为流派ID
}

// 购买卡片
message solo_buy_card {
    optional solo_user_key          _user_key       = 1; // 玩家Key
    optional bool                   _random         = 2; // 是否随机
    optional uint32                 _card_index     = 3; // 索引
}

// 商店刷新
message solo_shop_refresh {
    optional solo_user_key         _user_key       = 1; // 玩家Key
}

// 退出游戏（永久）
message solo_quit {
    optional solo_user_key         _user_key       = 1; // 玩家Key
}


// 选技战斗结果
message solo_battle_result {
    optional battle_result  _result         = 1; // 战斗结果
    optional uint32         _battle_time    = 2; // 战斗时间, 毫秒
}

// 战斗确认
message solo_battle_confirm {
    optional solo_user_key          _user_key       = 1; // 玩家Key
    optional uint32                 _round          = 2; // 回合数
    optional solo_battle_result     _result         = 3; // 战斗结果
}

// 心跳
message solo_heartbeat {
    optional solo_user_key         _user_key       = 1; // 玩家Key
}

// 刷新选项
message solo_refresh_choices {
    optional solo_user_key          _user_key       = 1; // 玩家Key
    optional bool                   _is_pay         = 2; // 是否付费刷新
}

// 查看玩家信息
message solo_monitor_player {
    optional solo_user_key         _user_key       = 1; // 玩家Key
    optional solo_user_key         _target_key     = 2; // 观战目标的key
}

// 进入观战模式
message solo_spectate_enter {
    optional solo_user_key         _user_key       = 1; // 玩家Key
    optional solo_user_key         _target_key     = 2; // 观战目标的key
}


// 表情包
message solo_emoji {
    optional solo_user_key      _user_key  = 1; // 玩家Key
    optional string              _content   = 2; // 内容
}

// 查看对战日志
message solo_view_journal {
    optional solo_user_key      _user_key       = 1; // 玩家Key
    optional uint32             _begin_round    = 2; // 起始回合
}

// 查看数据面板
message solo_view_dashboard {
    optional solo_user_key      _user_key  = 1; // 玩家Key
}

