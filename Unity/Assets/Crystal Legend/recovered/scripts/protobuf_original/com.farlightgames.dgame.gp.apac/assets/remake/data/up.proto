///////////////////////////////////////////////////////////////////////////////////////////

message login {
    enum region_type {
        cn            = 0; // 简体中文
        tw            = 1; // 台湾繁体
        jp            = 2; // 日语
        kr            = 3; // 韩语
        us            = 4; // 英语
        es            = 5; // 西语
    }
    optional uint64   _active_code    = 1;      // 激活码，初次登陆时提供
    optional string   _old_deviceid   = 2;      // 老设备ID，用于发放奖励
    optional string   _version        = 3;      // 客户端版本号
    optional string   _os             = 4;      // 客户端os
    optional string   _os_version     = 5;      // 客户端os版本
    optional string   _device         = 6;      // 客户端机型
    optional string   _lang           = 7;      // 客户端os语言
    optional region_type   _region    = 8;      // 客户端游戏语言 cn|tw
    optional string   _cpu            = 10;     // 客户端CPU类型
    optional bool     _is_adult       = 11;     // 是否成年
    optional string   _sdk_version    = 12;     // sdk版本
    optional string   _idfa           = 14;     // ios设备广告标识符，IOS客户端必填
    optional string   _android_id     = 15;     // 安卓设备id，安卓客户端必填
    optional string   _google_aid     = 16;     // google广告平台账号，安装了google play的设备可以渠道
    optional string   _ip             = 17;     // 客户端IP
    optional string   _ip_region      = 18;     // IP属地
    optional uint32   _sdk_plat_id    = 19;     // SDK指定的platform id
}

message sdk_login {
    optional string           _session_key    = 1;      // session id
    optional platform_type    _plat_id        = 2;      // platform id
    optional string           _mobile_num     = 3;      // mobile number
    optional string           _crypt_key      = 4;      // 密钥
    optional string           _sdk_version    = 5;      // sdk version 如duoku、91：3.6.3, lemon_base_sdk
    optional string           _sdk_params     = 6;      // sdk params
}

message request_userinfo {
}

message enter_stage {
    optional uint32 _stage_id = 1;
}

message exit_stage {
    optional battle_result     _result    = 1 [default = victory];
    optional uint32            _stars     = 2;
    repeated uint32            _heroes    = 3;  // hero type id
    repeated operation         _oprations = 4;  //
    // op = 0: cast skill
    // op = 1: revive hero
    optional string            _md5        = 5;
    repeated uint32            _self_data  = 6; // self hp
    repeated unit_battle_data  _unit_battle_data = 7;
    optional bool              _is_manual_battle = 8;
}

message unit_battle_data
{
    optional uint32            _unit_max_damage = 1; //
    repeated uint32            _unit_kill_list = 2;   //
    optional uint32            _unit_hid = 3;
}

