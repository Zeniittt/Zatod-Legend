  optional heat_open_panel        _open_panel       = 1; // 打开面板
  optional heat_enter_stage       _enter_stage      = 2; // 进入关卡
  optional heat_exit_stage        _exit_stage       = 3; // 退出关卡
  optional heat_rankboard         _rankboard        = 4; // 排行榜
  optional heat_get_task_rewards  _get_task_rewards = 5; // 领取任务奖励
}

message heat_open_panel {
  optional    uint32         _group_id = 1; // 组id
}

message heat_enter_stage {
    optional uint32         _group_id         = 1; // 组id
    optional uint32         _stage_id         = 2; // 关卡id
    repeated uint32         _lineup           = 3; // 阵容
    optional uint32         _item_id          = 4; // 战斗使用的道具id
}

message heat_exit_stage {
    optional uint32             _group_id         = 1; // 组id
    optional battle_result      _result           = 2; // 战斗结果
    repeated operation          _operations       = 3; // 战斗操作
    optional uint32             _battle_time      = 4; // 战斗时长
    repeated choose_heat        _choose_heat      = 5; // 热力选择
    optional uint32             _total_heat       = 6; // 总热度
}

// 热力排行榜
message heat_rankboard {
  optional uint32     _group_id = 1;
}

message heat_get_task_rewards {
  optional uint32      _group_id    = 1;
  optional uint32      _line_id     = 2;
  optional uint32      _task_id     = 3;
}

// 同步服务器时间戳
message sync_timestamps {
    optional uint32     _days   = 1; // 天数，默认2天
}

